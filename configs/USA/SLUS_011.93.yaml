name: Main Executable (SLUS_011.93)
sha1: e55ed5bf354def07f0cbf4e1fb7fb5f99204f220
options:
  basename: main
  target_path: dumps/disc/SLUS_011.93
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/USA/main
  src_path: src/main
  build_path: build/USA
  ld_script_path: linkers/USA/main.ld
  elf_path: build/USA/main.elf
  ld_dependencies: True

  find_file_boundaries: True
  migrate_rodata_to_functions: True
  pair_rodata_to_text: False
  gp_value: 0x800506F8

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False

  dump_symbols: True
  dump_symbols_references: True

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  symbol_addrs_path:
