  undefined_funcs_auto_path: linkers/USA/undefined_funcs_auto.main.txt
  undefined_syms_auto_path: linkers/USA/undefined_syms_auto.main.txt

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  ld_bss_is_noload: True

segments:
  - name: header
    type: header
    start: 0x0

  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    align: 4
    subalign: 4
    subsegments:
      - [0x800, rodata, 800]
      - [0x156C, c, 156C]        # crt0, task runner, Task_Run (asm); -G0
      - [0x187C, c, 187C]        # main game code from Task_Create (-G8); defines Menu_Ctx
      - [0x307C, c, 307C]
      - [0x4BCC, c, 4BCC]        # from func_800143CC: menu sub tasks (Menu_Ctx extern)
      - [0x6530, c, 6530]
      - [0x77DC, c, 77DC]
      - [0xE280, c, E280]
      - [0x105BC, c, 105BC]      # from Gfx_AttachModel: sys.c (rcsid D_800101E4)
      - [0x12550, c, 12550]      # from func_80021D50: event flag reset (defines D_8005071C)
      - [0x12654, c, 12654]      # from Mem_TestBit: flags, save, item bag, roster
      - [0x13584, c, 13584]      # from Mem_Free: heap, pad, vsync, Sys_Main, rand, cd cache
      - [0x14C74, c, psyq]      # PsyQ 4.7 libraries (PadGetState ..), asm only, not counted
      - [0x314F0, .data, 156C]   # .data starts after _card_read (main task row, Task_DescTable)
      - [0x31570, .data, 187C]
      - [0x31638, .data, 307C]
      - [0x316B4, .data, 4BCC]
      - [0x316FC, .data, 6530]
      - [0x3171C, .data, 77DC]
      - [0x31EB4, .data, E280]
      - [0x31EFC, .data, 12654]
      - [0x31F04, data, 31F04]
      - [0x53B60, bin, Ovl_LoadArea] # 0x80063360: overlay load area; the image holds leftover bytes here
  - [0x9F000]
