name: Main Executable (SLUS_011.93)
sha1: e55ed5bf354def07f0cbf4e1fb7fb5f99204f220
options:
  basename: main
  target_path: dumps/disc/SLUS_011.93
  base_path: ../..
  platform: psx
  compiler: PSYQ

  asm_path: asm/USA/main
  src_path: src/main
  build_path: build/USA
  ld_script_path: linkers/USA/main.ld
  elf_path: build/USA/main.elf
  ld_dependencies: True

  find_file_boundaries: True
  migrate_rodata_to_functions: True
  pair_rodata_to_text: False
  gp_value: 0x800506F8

  o_as_suffix: False
  use_legacy_include_asm: False

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False

  dump_symbols: True
  dump_symbols_references: True

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  symbol_addrs_path:
    - configs/USA/sym.main.txt
  reloc_addrs_path:
    - configs/USA/rel.main.txt

  undefined_funcs_auto_path: linkers/USA/undefined_funcs_auto.main.txt
  undefined_syms_auto_path: linkers/USA/undefined_syms_auto.main.txt

  subalign: 4

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  ld_bss_is_noload: True

segments:
  - name: header
    type: header
    start: 0x0

  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    align: 4
    subalign: 4
    subsegments:
      - [0x800, rodata, 800]
      - [0x156C, c, 156C]        # .text as c-type: INCLUDE_ASM per-function nonmatchings
      - [0x14C74, c, psyq]      # PsyQ 4.7 libraries (PadGetState ..), asm only, not counted
      - [0x31570, data, 31570]   # estimated .data start (refine after first split)
  - [0x9F000]
